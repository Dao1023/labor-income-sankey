<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>劳动收入组成 · 去向你手里的每一块钱</title>
<style>
:root {
  --bg:#eef1f7; --card:#ffffff; --border:#e4e8f0; --text:#1e293b; --muted:#52607a;
  --blue:#2563eb; --title-blue:#1d55a5; --green:#16a34a; --red:#dc2626; --cream:#f2efe9;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif; padding:20px 28px; }
.layout { display:flex; gap:18px; align-items:stretch; }

/* ---- left case rail ----
   absolutely sized to the main column's height (chart panel height), so rail +
   chart share one top/bottom edge at any viewport width; the rail's own cell
   grid scrolls internally and never drives the row height */
.layout { position:relative; }
#logoRail { position:absolute; top:0; bottom:0; left:0; width:132px; display:grid; grid-template-columns:1fr 1fr; gap:10px;
  align-content:start; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px;
  overflow-y:auto;
  scrollbar-width:none; -ms-overflow-style:none; /* scrollable, scrollbar hidden */ }
#logoRail::-webkit-scrollbar { display:none; }
/* white cell + hairline ring via inset box-shadow (zero layout impact, unlike a
   border) so the coloured case chip sits on a clean matching surface */
.logo { position:relative; border:2px solid transparent; border-radius:10px; background:#fff;
  box-shadow:inset 0 0 0 1px rgba(100,116,139,.28);
  cursor:pointer; padding:5px; display:flex; align-items:center; justify-content:center; transition:border-color .15s, background .15s, transform .1s; }
.logo:hover { border-color:#b9c6dd; transform:translateY(-1px); box-shadow:inset 0 0 0 1px rgba(100,116,139,.45); }
.logo.active { border-color:var(--blue); background:#e8effc; box-shadow:inset 0 0 0 1px rgba(37,99,235,.55); }
.logo:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
/* fixed aspect-ratio chip: text-only case cell (no logos, no emoji) */
.logo .mono { width:100%; aspect-ratio:1; display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:13.5px; line-height:1.15; color:#fff; border-radius:6px; text-align:center; letter-spacing:0; }

/* ---- row 2: case rail (left) + chart (right) ---- */
.main { flex:1; min-width:0; margin-left:150px; } /* 132px rail + 18px gap */
/* ---- row 1: brand (left) + controls (right); fixed-height toolbar ---- */
.toolbar { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:14px; }
.toolbar .left { display:flex; align-items:center; gap:14px; min-width:0; }
#brand { font-size:20px; font-weight:800; color:var(--title-blue); white-space:nowrap; }
.controls { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
/* Header is a normal FLOW stack inside #chartPanel: meta on its own row, the title
   on the next row, so long case/city strings never run through the meta text. */
.meta { position:static; font-size:11px; color:var(--muted); text-align:left; line-height:1.5;
  padding:8px 250px 0 14px; min-height:36px; }
.meta a { color:var(--blue); pointer-events:auto; }
/* case caveat line: an independent small-gray row under the meta lines. */
.segNote { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2;
  overflow:hidden; margin-top:2px; }
#btnNote { background:var(--card); color:var(--text); border:1px solid #d8dee9; border-radius:10px; padding:9px 14px; font-size:13.5px; font-weight:600; cursor:pointer; }
#btnNote:hover { border-color:var(--blue); color:var(--title-blue); background:#e8effc; }
.cityPick { display:flex; align-items:center; gap:4px; background:var(--card); border:1px solid #d8dee9;
  border-radius:10px; padding:0 6px 0 11px; font-size:13px; font-weight:600; color:var(--muted); }
.cityPick select { appearance:none; -webkit-appearance:none; border:none; background-color:transparent;
  color:var(--text); font-size:13.5px; font-weight:600; padding:9px 20px 9px 4px; cursor:pointer;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%2352607a' stroke-width='1.6'/%3E%3C/svg%3E");
  background-repeat:no-repeat; background-position:right 4px center; }
.cityPick select:focus-visible { outline:2px solid var(--blue); outline-offset:2px; border-radius:6px; }
.exportGroup { display:flex; background:var(--card); border:1px solid #d8dee9; border-radius:10px; overflow:hidden; box-shadow:0 1px 3px rgba(30,41,59,.06); }
.exportGroup button { appearance:none; border:none; background:transparent; color:var(--text); padding:9px 18px;
  font-size:13.5px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:7px; transition:background .15s, color .15s; }
.exportGroup button + button { border-left:1px solid #e4e8f0; }
.exportGroup button:hover { background:#e8effc; color:var(--title-blue); }
.exportGroup button:active { background:#dbe7fa; }
.exportGroup svg { width:15px; height:15px; }
.exportGroup button.active { background:#dbe7fa; color:var(--title-blue); }
.exportGroup button.active:hover { background:#cfe0f8; }

#chartPanel { background:var(--cream); border:1px solid var(--border); border-radius:10px; position:relative; overflow:hidden; }
#chartPanel .in-title { text-align:center; padding:4px 16px 8px; font-size:clamp(20px, 2.05vw, 30px); line-height:1.2; font-weight:800; color:var(--title-blue); overflow-wrap:anywhere; }
#sankey { width:100%; height:660px; display:block; }

/* ---- bottom salary slider (upstream quarter timeline, same interaction skeleton) ---- */
#timeline { padding:10px 26px 16px; }
.tl-head { display:flex; justify-content:space-between; align-items:baseline; margin:0 30px 8px; font-size:12.5px; color:var(--muted); }
.tl-cap { font-weight:600; }
.tl-now b { color:var(--title-blue); font-size:14px; font-variant-numeric:tabular-nums; }
.tl-now .tl-unit { margin-left:3px; }
.tl-track { position:relative; height:6px; background:#dfe3ec; border-radius:3px; margin:0 30px; }
/* invisible vertical extension — a 6px track is hard to hit; a pointerdown
   anywhere in this band jumps to the nearest salary step */
.tl-track::before { content:''; position:absolute; left:0; right:0; top:-14px; bottom:-14px; }
.tl-fill { position:absolute; left:0; top:0; bottom:0; background:var(--blue); border-radius:3px; }
.tl-thumb { position:absolute; top:50%; width:20px; height:20px; border-radius:50%; background:#fff;
  border:3px solid var(--blue); box-shadow:0 1px 4px rgba(30,41,59,.25); transform:translate(-50%,-50%); cursor:grab; }
.tl-thumb:active { cursor:grabbing; }
.tl-thumb:focus-visible { outline:2px solid var(--blue); outline-offset:3px; }
.tl-ticks { display:flex; justify-content:space-between; margin:10px 30px 0; }
.tl-tick { flex:0 0 auto; text-align:center; cursor:pointer; color:var(--muted); font-size:12.5px; line-height:1.35; user-select:none; position:relative; }
/* generous invisible hit area around each tick label — easy to hit without
   changing the visible layout. Horizontal expansion is deliberately 0: the
   nearest-centre fallback in #tlTicks' delegated click handler resolves
   the active tick's wider caption. */
.tl-tick::before { content:''; position:absolute; inset:-8px 0; }
.tl-tick .q { font-weight:600; font-variant-numeric:tabular-nums; }
.tl-tick:hover .q { color:var(--blue); }
.tl-tick.active .q { color:var(--blue); font-weight:800; }
.tl-tick.active .d { color:var(--text); font-weight:600; }
.tl-tick .d { font-size:11px; color:#52607a; }
.tl-tick.active { transform:scale(1.06); }
.tl-tick { transition:transform .12s; }
/* snap dots: one landing point per salary step, semi-transparent; nearest one
   highlighted while dragging so the user sees where the thumb will land */
.tl-dot { position:absolute; top:50%; width:2px; height:12px; background:rgba(30,41,59,.15);
  transform:translate(-50%,-50%); border-radius:1px; pointer-events:none;
  transition:background .1s, width .1s, height .1s; }
#timeline.hover .tl-dot, #timeline.dragging .tl-dot { background:rgba(30,41,59,.32); }
.tl-dot.near, #timeline.dragging .tl-dot.near, #timeline.hover .tl-dot.near { background:var(--blue); width:4px; height:20px; }
#timeline.hover .tl-thumb { box-shadow:0 0 0 6px rgba(37,99,235,.12), 0 1px 4px rgba(30,41,59,.25); }

/* ---- 口径说明 dialog ---- */
#noteModal { position:fixed; inset:0; z-index:80; background:rgba(15,23,42,.38); display:flex; align-items:center; justify-content:center; padding:24px; }
#noteModal[hidden] { display:none; }
.noteBox { position:relative; width:100%; max-width:680px; max-height:82vh; overflow:auto; background:#fff;
  border-radius:14px; padding:22px 26px 24px; box-shadow:0 18px 50px rgba(15,23,42,.28); }
.noteBox h2 { font-size:18px; color:var(--title-blue); margin-bottom:10px; }
.noteBox p { font-size:13px; line-height:1.75; color:#334155; margin-bottom:8px; }
.noteBox .k { color:var(--muted); }
.noteBox .src { font-size:11.5px; color:var(--muted); line-height:1.7; }
.noteBox .src a { color:var(--blue); }
.noteX { position:absolute; top:8px; right:12px; border:none; background:transparent; font-size:22px; line-height:1; color:#64748b; cursor:pointer; }

@media (max-width: 900px) {
  .layout { flex-direction:column; }
  #logoRail { position:static; width:100%; grid-template-columns:repeat(10,1fr); }
  .main { margin-left:0; }
  /* the slider gets the panel's full width: 26px side padding + 30px tick
     margins ate 112px of a 332px panel */
  #timeline { padding:8px 10px 12px; }
  .tl-ticks { margin:10px 4px 0; }
  .tl-head { margin:0 4px 8px; }
}
@media (max-width: 480px) {
  /* the exact-value caption is wider than a 30-40px tick slot at this width;
     the slider head already states the current salary, so drop it */
  .tl-tick .d { display:none; }
}
/* ---- phone layout (≤768) ----
   Rail is collapsed behind a count button by default, toolbar becomes a single
   compact row, and the chart starts inside the first screen. */
#logoToggle { display:none; }
@media (max-width: 768px) {
  body { padding:10px 10px 16px; }
  .toolbar { gap:8px; margin-bottom:8px; }
  .toolbar .left { flex:1 1 100%; gap:8px; flex-wrap:nowrap; min-width:0; }
  #brand { font-size:17px; }
  .controls { flex:1 1 100%; gap:6px; }
  .exportGroup button { padding:7px 10px; font-size:12px; gap:4px; }
  .exportGroup svg { width:13px; height:13px; }
  #btnNote { padding:7px 10px; font-size:12px; }
  .layout { gap:8px; }
  /* collapsible case rail: a single horizontally scrollable strip when open */
  #logoToggle { display:flex; align-items:center; gap:6px; align-self:flex-start;
    appearance:none; border:1px solid #d8dee9; background:var(--card); color:var(--text);
    border-radius:999px; padding:6px 12px; font-size:12.5px; font-weight:700; cursor:pointer; }
  #logoToggle .caret { color:var(--blue); font-size:10px; }
  #logoRail { display:none; }
  #logoRail.open { display:flex; gap:8px; overflow-x:auto; overflow-y:hidden; padding:8px;
    scrollbar-width:thin; }
  #logoRail.open .logo { flex:0 0 54px; }
  #logoRail.open .logo .mono { font-size:12px; }
  .meta { padding:6px 12px 0; min-height:0; }
  #chartPanel .in-title { padding:2px 12px 6px; }
  #sankey { height:520px; }
  #timeline { padding:6px 8px 10px; }
}
@media (max-width: 400px) {
  #sankey { height:480px; }
}
</style>
</head>
<body>
<div class="toolbar">
  <div class="left">
    <span id="brand"></span>
  </div>
  <div class="controls">
    <div class="exportGroup" id="viewGroup">
      <button id="btnViewBridge" aria-pressed="true"><span id="lblViewBridge"></span></button>
      <button id="btnViewCost" aria-pressed="false"><span id="lblViewCost"></span></button>
    </div>
    <div class="exportGroup" id="modeGroup">
      <button id="btnPct" aria-pressed="false"><span id="lblPct"></span></button>
    </div>
    <label class="cityPick"><span>城市</span><select id="citySelect" aria-label="城市"></select></label>
    <button id="btnNote" type="button">口径说明</button>
    <div class="exportGroup">
      <button id="btnExportPNG"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg><span id="lblExportPNG"></span></button>
      <button id="btnExportSVG"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg><span id="lblExportSVG"></span></button>
    </div>
  </div>
</div>
<div class="layout">
  <button id="logoToggle" type="button" aria-controls="logoRail" aria-expanded="false"><span id="logoCount"></span><span class="caret">▾</span></button>
  <div id="logoRail" role="group" aria-label="用工案例"></div>
  <div class="main">
    <div id="chartPanel">
      <div class="meta" id="metaLine"></div>
      <div class="in-title" id="chartTitle"></div>
      <div id="sankey"></div>
      <div id="timeline">
        <div class="tl-head"><span class="tl-cap">薪资档位</span><span class="tl-now"><b id="tlNow"></b><span class="tl-unit">/ 月</span></span></div>
        <div class="tl-track" id="tlTrack"><div class="tl-fill" id="tlFill"></div><div class="tl-thumb" id="tlThumb" role="slider" tabindex="0" aria-label="薪资档位" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-valuetext=""></div></div>
        <div class="tl-ticks" id="tlTicks"></div>
      </div>
    </div>
  </div>
</div>
<div id="noteModal" hidden>
  <div class="noteBox" role="dialog" aria-modal="true" aria-labelledby="noteTitle" tabindex="-1">
    <button class="noteX" id="noteX" type="button" aria-label="关闭">×</button>
    <h2 id="noteTitle">口径说明</h2>
    <div id="noteBody"></div>
  </div>
</div>
<script src="vendor/echarts.min.js"></script>
<script src="../app/data.js"></script>
<script src="../app/engine.js"></script>
<script src="labor.js"></script>
<script src="app.js"></script>
</body>
</html>
