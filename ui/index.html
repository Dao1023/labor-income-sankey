<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>劳动收入组成 · 桑基图</title>
<style>
:root {
  --bg:#eef1f7; --card:#ffffff; --border:#e4e8f0; --text:#1e293b; --muted:#64748b;
  --blue:#2563eb; --title-blue:#1d55a5; --green:#16a34a; --red:#dc2626; --cream:#f2efe9;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif; padding:20px 28px; }
.layout { display:flex; gap:18px; align-items:stretch; position:relative; }

/* ---- left case rail (was the logo rail) ---- */
#logoRail { position:absolute; top:0; bottom:0; left:0; width:132px; display:grid; grid-template-columns:1fr 1fr; gap:9px;
  align-content:start; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:10px;
  overflow-y:auto; scrollbar-width:thin; scrollbar-color:#cbd5e1 transparent; }
#logoRail::-webkit-scrollbar { width:4px; }
#logoRail::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:2px; }
#logoRail::-webkit-scrollbar-track { background:transparent; }
.logo { position:relative; border:2px solid transparent; border-radius:10px; background:#fff;
  box-shadow:inset 0 0 0 1px rgba(100,116,139,.28);
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:border-color .15s, background .15s, transform .1s; }
.logo:hover { border-color:#b9c6dd; transform:translateY(-1px); }
.logo.active { border-color:var(--blue); background:#dbe7fa; box-shadow:inset 0 0 0 1px rgba(37,99,235,.55); }
/* pure-text case cell: 2-3 characters on a group-tinted square */
.logo.caseMon { aspect-ratio:1; font-size:13px; font-weight:800; letter-spacing:0; color:#1e293b; text-align:center;
  line-height:1.05; white-space:nowrap; }
.logo.caseMon.active { color:var(--title-blue); }

/* ---- row 2: rail (left) + chart (right) ---- */
.main { flex:1; min-width:0; margin-left:150px; }
.toolbar { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:14px; }
.toolbar .left { display:flex; align-items:center; gap:14px; min-width:0; }
#brand { font-size:20px; font-weight:800; color:var(--title-blue); white-space:nowrap; }
.controls { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
#citySelect { appearance:auto; background:var(--card); color:var(--text); border:1px solid #d8dee9; border-radius:10px;
  padding:8px 12px; font-size:13.5px; font-weight:600; cursor:pointer; box-shadow:0 1px 3px rgba(30,41,59,.06); }
#citySelect:hover { border-color:var(--blue); }
.exportGroup { display:flex; background:var(--card); border:1px solid #d8dee9; border-radius:10px; overflow:hidden; box-shadow:0 1px 3px rgba(30,41,59,.06); }
.exportGroup button { appearance:none; border:none; background:transparent; color:var(--text); padding:9px 16px;
  font-size:13.5px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:7px; transition:background .15s, color .15s; }
.exportGroup button + button { border-left:1px solid #e4e8f0; }
.exportGroup button:hover { background:#e8effc; color:var(--title-blue); }
.exportGroup button:active { background:#dbe7fa; }
.exportGroup button.active { background:#dbe7fa; color:var(--title-blue); }
.exportGroup button:disabled { color:#b6bfcc; cursor:not-allowed; }
.exportGroup button:disabled:hover { background:transparent; color:#b6bfcc; }
.exportGroup svg { width:15px; height:15px; }

#chartPanel { background:var(--cream); border:1px solid var(--border); border-radius:10px; position:relative; overflow:hidden; }
.meta { font-size:11px; color:var(--muted); text-align:left; line-height:1.5; padding:9px 14px 0; min-height:22px; }
#chartPanel .in-title { text-align:center; padding:2px 16px 6px; font-size:clamp(20px, 2.05vw, 30px); line-height:1.2; font-weight:800; color:var(--title-blue); overflow-wrap:anywhere; }
#sankey { width:100%; height:clamp(520px, 60vh, 640px); display:block; position:relative; }
#sankey > svg.ovl { position:absolute; left:0; top:0; pointer-events:none; overflow:visible; z-index:3; }
#sankey .lb { font-family:"Segoe UI","Microsoft YaHei",sans-serif; font-size:13.5px; font-weight:700; fill:#1e293b;
  paint-order:stroke; stroke:#f2efe9; stroke-width:3.4px; stroke-linejoin:round; }
#sankey .lbv { font-size:11.5px; font-weight:600; fill:#64748b; }
#sankey .ld { fill:none; stroke:#c3ccdb; stroke-width:1; }

/* ---- bottom salary slider (was the quarter timeline) ---- */
#timeline { padding:6px 26px 14px; position:relative; }
.tl-head { display:flex; justify-content:flex-end; align-items:baseline; gap:8px; margin:0 30px 6px; font-size:12px; color:var(--muted); }
.tl-head b { font-size:14px; color:var(--title-blue); font-weight:800; font-variant-numeric:tabular-nums; }
.tl-track { position:relative; height:6px; background:#dfe3ec; border-radius:3px; margin:0 30px; cursor:pointer; }
.tl-track::before { content:''; position:absolute; left:0; right:0; top:-14px; bottom:-14px; }
.tl-fill { position:absolute; left:0; top:0; bottom:0; background:var(--blue); border-radius:3px; }
.tl-thumb { position:absolute; top:50%; width:20px; height:20px; border-radius:50%; background:#fff;
  border:3px solid var(--blue); box-shadow:0 1px 4px rgba(30,41,59,.25); transform:translate(-50%,-50%); cursor:grab; }
.tl-thumb:active { cursor:grabbing; }
.tl-ticks { display:flex; justify-content:space-between; margin:10px 30px 0; position:relative; }
.tl-tick { flex:0 0 auto; text-align:center; cursor:pointer; color:var(--muted); font-size:12.5px; line-height:1.35; user-select:none; position:relative; }
.tl-tick::before { content:''; position:absolute; inset:-10px -18px; }
.tl-tick .q { font-weight:600; }
.tl-tick:hover .q { color:var(--blue); }
.tl-tick.active .q { color:var(--blue); font-weight:800; }
.tl-tick .d { font-size:11px; color:#9aa4b5; }

#footNote { margin-top:10px; font-size:11px; color:#9aa4b5; text-align:center; }
#footNote button { appearance:none; border:none; background:none; color:#7c8ba1; font-size:11px; text-decoration:underline; cursor:pointer; padding:0 2px; }

@media (max-width: 900px) {
  .layout { flex-direction:column; }
  #logoRail { position:static; width:100%; grid-template-columns:repeat(10,1fr); max-height:none; }
  .main { margin-left:0; }
  #sankey { height:460px; }
}
</style>
</head>
<body>
<div class="toolbar">
  <div class="left">
    <span id="brand">劳动收入组成</span>
  </div>
  <div class="controls">
    <select id="citySelect" title="社保基数与费率按 2026 社保年度"></select>
    <div class="exportGroup" id="pctGroup">
      <button id="btnPct" title="切换：金额 / 占该列合计的百分比">占比</button>
    </div>
    <div class="exportGroup" id="viewGroup">
      <button id="btnViewPerson" class="active">个人视角</button>
      <button id="btnViewCost">单位成本</button>
    </div>
    <div class="exportGroup">
      <button id="btnExportPNG"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg><span>导出 PNG</span></button>
      <button id="btnExportSVG"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg><span>导出 SVG</span></button>
    </div>
  </div>
</div>
<div class="layout">
  <div id="logoRail"></div>
  <div class="main">
    <div id="chartPanel">
      <div class="meta" id="metaLine"></div>
      <div class="in-title" id="chartTitle"></div>
      <div id="sankey"></div>
      <div id="timeline">
        <div class="tl-head"><span>税前应发</span><b id="tlNow">—</b></div>
        <div class="tl-track" id="tlTrack"><div class="tl-fill" id="tlFill"></div><div class="tl-thumb" id="tlThumb"></div></div>
        <div class="tl-ticks" id="tlTicks"></div>
      </div>
    </div>
    <div id="footNote">近似建模，非真实工资条 · 社保与个税按 2026 口径 · 城市间仅可比结构 · <span id="unitNote">单位：元 / 月</span> <button id="btnNote">数据口径</button></div>
  </div>
</div>
<script src="../app/data.js"></script>
<script src="../app/engine.js"></script>
<script src="vendor/echarts.min.js"></script>
<script src="labor.js"></script>
<script src="app.js"></script>
</body>
</html>
